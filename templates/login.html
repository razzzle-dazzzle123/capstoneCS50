<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - To-Do Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
      <div class="container">
        <span class="navbar-brand mb-0 h1">To-Do Tracker</span>
      </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center">
      <div
        class="card shadow-sm w-100 border-0"
        style="max-width: 400px; border-radius: 12px"
      >
        <div class="card-body p-5">
          <h2 class="text-center mb-4 fw-bold">Welcome Back</h2>

          <form id="loginForm">
            <div class="mb-3">
              <input
                type="text"
                id="logUsername"
                class="form-control form-control-lg"
                placeholder="Username"
                required
              />
            </div>
            <div class="mb-4">
              <input
                type="password"
                id="logPassword"
                class="form-control form-control-lg"
                placeholder="Password"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
              Log In
            </button>
          </form>

          <p id="errorMessage" class="text-danger text-center mt-3 fw-bold"></p>

          <hr class="my-4" />

          <div class="text-center">
            <p class="mb-0 text-muted">
              Don't have an account? <br />
              <a href="/register" class="text-decoration-none fw-bold"
                >Register here</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </body>
</html>
